name: Bug report
description: Report a reproducible problem in Assembly.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. For security vulnerabilities or exposed keys, do not use this form; follow SECURITY.md for private reporting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
      placeholder: A short, concrete description.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps that demonstrates the issue.
      placeholder: |
        1. Start Assembly...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Python/Node versions, commit or release, and whether web or local dev mode was used.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or other evidence
      description: Include sanitized evidence only. Remove API keys, tokens, private prompts, and personal data.
    validations:
      required: false
