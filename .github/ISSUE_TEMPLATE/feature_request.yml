name: Feature request
description: Propose a focused improvement to Assembly.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user or contributor problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change. Note any alternatives considered.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reliability / orchestration
        - Evaluation / testing
        - Provider support
        - UX / accessibility
        - Security / privacy
        - Documentation / developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How would we know this improvement is complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for similar requests.
          required: true
        - label: This request does not disclose a security vulnerability or private data.
          required: true
