name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ./frontend/package-lock.json
    - name: Install Dependencies
      run: npm ci --legacy-peer-deps
    - name: Run npm audit
      run: npm run audit:high
    - name: Run npm audit gate regression tests
      run: npm run audit:test
    - name: Verify Content Security Policy configuration
      run: npm run security:csp:test
    - name: Lint
      run: npm run lint
    - name: Type Check
      run: npx tsc --noEmit
    - name: Production Build
      run: npm run build
    - name: Run confidence display regression tests
      run: npx vitest run --config vitest.config.mts src/components/final-answer.test.tsx src/components/execution-timing.test.tsx src/hooks/use-execution.test.ts src/lib/execution-timing.test.ts
    - name: Run privacy dialog tests
      run: npx vitest run --config vitest.config.mts src/components/privacy-dialog.test.tsx
    - name: Run theme toggle tests
      run: npx vitest run --config vitest.config.mts src/components/theme-toggle.test.tsx
    - name: Run Vitest storage lifecycle tests
      run: npm test
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright Tests
      run: npx playwright test
      env:
        CI: true
    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: ./frontend/playwright-report/
        retention-days: 7

  backend-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      run: pip install -r requirements.txt -r requirements-dev.txt alembic pip-audit
    - name: Run Python dependency audit gate
      run: python scripts/audit_python.py
    - name: Check committed execution event schema
      run: python scripts/export_event_schema.py --check
    - name: Run SQLite migrations and tests
      run: |
        alembic upgrade head
        pytest
