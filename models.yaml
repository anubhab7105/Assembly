# Assembly — model + provider catalog (single source of truth).
#
# RULE: switching a model id, family, role, limit, or endpoint means editing
# THIS FILE ONLY. No model ids, limits, or families may be hard-coded in src/.
# Model order inside each provider matters: list the fastest/cheapest model
# first — the router tries candidates top-down, so tight time budgets get
# the fast models without any code changes.
#
# SHAPE (one shape only — no legacy aliases):
#   providers.<id>.models[]: {id, family, roles, scope, limits}
#   limits: {rpm, rpd, tpm, context_tokens} — each is a positive int, the
#     literal `unlimited` (provider enforces no limit there; the limiter
#     skips it), or null (unknown).
#   scope: `model` (limits enforced per key+model) or `account` (limits
#     shared across the provider's models on one key, e.g. OpenRouter free).
# There is NO provider-level `limits:` anymore — it was removed so a
# half-migrated file fails validation loudly instead of routing on
# stale numbers.
#
# FILL RULE: every value carries a source + checked-date comment. Never
# invent numbers — fill them from the dashboard page named in the comment
# (or `scripts/verify_models.py --save` output). Null on an ENABLED
# provider fails startup loudly (validate_limits_filled); providers you
# have not filled in must stay enabled: false.
# Families must come from the KNOWN_FAMILIES set in src/providers/config.py
# (gemini, llama, qwen, gpt-oss, deepseek, mistral, kimi, gemma, nemotron,
# allam, phi). Unknown families fail startup loudly — that is intentional:
# an unclassified model breaks the independence (diversity) accounting.
# Roles: solver, researcher, critic, synthesizer, planner.

providers:
  gemini:
    base: google-genai
    key_url: https://aistudio.google.com/apikey
    enabled: true
    privacy_note: "Free-tier requests may be used by Google to improve its products. Avoid sending sensitive or confidential information."
    models:
      - id: gemini-3.8-flash
        family: gemini
        roles: [solver, researcher, critic, synthesizer, planner]
        scope: model
        limits:
          # rpm/rpd/tpm: pending re-probe (verify 2026-10-09 transport-error
          # at 20 s; re-run with --provider gemini --timeout 60 first).
          rpm: null # source: aistudio.google.com/rate-limit; checked: pending re-probe
          rpd: null # source: aistudio.google.com/rate-limit; checked: pending re-probe
          tpm: null # source: aistudio.google.com/rate-limit; checked: pending re-probe
          context_tokens: 1000000 # source: aistudio.google.com/rate-limit; checked: pending re-probe

  groq:
    base: openai-compatible
    url: https://api.groq.com/openai/v1
    key_url: https://console.groq.com/keys
    enabled: true
    models:
      - id: openai/gpt-oss-20b
        family: gpt-oss
        # No researcher role: the model emits native browser.search turns on
        # research-flavored prompts and Groq 400s them (tool_use_failed) when
        # no tools are defined — and Assembly never defines tools.
        # source: live probes 2026-10-09 (exact researcher prompt 3/3 HTTP 400)
        # + console.groq.com/docs/tool-use/built-in-tools/browser-search (opt-in only);
        # checked: 2026-10-09
        roles: [solver, critic, planner]
        scope: model
        limits:
          rpm: 30 # source: verify report headers + console.groq.com/docs/rate-limits; checked: 2026-10-09
          rpd: 1000 # source: verify report headers + console.groq.com/docs/rate-limits; checked: 2026-10-09
          tpm: 8000 # source: verify report headers + console.groq.com/docs/rate-limits; checked: 2026-10-09
          # Effective free-tier per-request limit, not the advertised context.
          context_tokens: 8000 # source: console.groq.com/docs/rate-limits; checked: 2026-10-09
      - id: openai/gpt-oss-120b
        family: gpt-oss
        roles: [solver, critic, synthesizer]
        scope: model
        limits:
          rpm: 30 # source: verify report headers + console.groq.com/docs/rate-limits; checked: 2026-10-09
          rpd: 1000 # source: verify report headers + console.groq.com/docs/rate-limits; checked: 2026-10-09
          tpm: 8000 # source: verify report headers + console.groq.com/docs/rate-limits; checked: 2026-10-09
          # Effective free-tier per-request limit, not the advertised context.
          context_tokens: 8000 # source: console.groq.com/docs/rate-limits; checked: 2026-10-09
      - id: qwen/qwen3.8-27b
        family: qwen
        roles: [solver, researcher]
        scope: model
        limits:
          rpm: 30 # source: verify report headers + console.groq.com/docs/rate-limits; checked: 2026-10-09
          rpd: 1000 # source: verify report headers + console.groq.com/docs/rate-limits; checked: 2026-10-09
          tpm: 8000 # source: verify report headers + console.groq.com/docs/rate-limits; checked: 2026-10-09
          # Effective free-tier per-request limit, not the advertised context.
          context_tokens: 8000 # source: console.groq.com/docs/rate-limits; checked: 2026-10-09

  cerebras:
    base: openai-compatible
    url: https://api.cerebras.ai/v1
    key_url: https://cloud.cerebras.ai
    # Disabled 2026-10-09: key returns 402 payment-required on every model
    # (verify report); re-enable only with a funded key + filled limits.
    enabled: false
    models:
      - id: gpt-oss-120b
        family: gpt-oss
        roles: [solver, critic, synthesizer]
        scope: model
        limits:
          rpm: null # source: cloud.cerebras.ai billing/limits; checked: unfilled
          rpd: null # source: cloud.cerebras.ai billing/limits; checked: unfilled
          tpm: null # source: cloud.cerebras.ai billing/limits; checked: unfilled
          context_tokens: null # source: cloud.cerebras.ai docs/models; checked: unfilled
      - id: qwen-3.8-27b
        family: qwen
        roles: [solver, researcher]
        scope: model
        limits:
          rpm: null # source: cloud.cerebras.ai billing/limits; checked: unfilled
          rpd: null # source: cloud.cerebras.ai billing/limits; checked: unfilled
          tpm: null # source: cloud.cerebras.ai billing/limits; checked: unfilled
          context_tokens: null # source: cloud.cerebras.ai docs/models; checked: unfilled

  openrouter:
    base: openai-compatible
    url: https://openrouter.ai/api/v1
    key_url: https://openrouter.ai/keys
    enabled: true
    # OpenRouter appreciates callers identifying themselves; fill yours in.
    headers:
      HTTP-Referer: https://localhost:8000
      X-Title: Assembly
    models:
      - id: google/gemma-4-26b-a4b-it:free
        family: gemma
        roles: [solver, researcher, planner]
        # The free daily cap is shared across all free models on the key.
        scope: account
        limits:
          rpm: 20 # source: openrouter.ai dashboard; checked: 2026-10-09
          rpd: 50 # source: openrouter.ai dashboard (shared free-model cap); checked: 2026-10-09
          tpm: unlimited # source: openrouter.ai dashboard (no token cap); checked: 2026-10-09
          context_tokens: 262144 # source: openrouter.ai model page context; checked: 2026-10-09
      - id: nvidia/nemotron-3-super-120b-a12b:free
        family: nemotron
        roles: [solver, critic, synthesizer]
        # The free daily cap is shared across all free models on the key.
        scope: account
        limits:
          rpm: 20 # source: openrouter.ai dashboard; checked: 2026-10-09
          rpd: 50 # source: openrouter.ai dashboard (shared free-model cap); checked: 2026-10-09
          tpm: unlimited # source: openrouter.ai dashboard (no token cap); checked: 2026-10-09
          context_tokens: 262144 # source: openrouter.ai model page context; checked: 2026-10-09

  mistral:
    base: openai-compatible
    url: https://api.mistral.ai/v1
    key_url: https://console.mistral.ai
    # Disabled until a key is added (no MISTRAL_API_KEY locally 2026-10-09).
    enabled: false
    models:
      # Verify the exact id in console.mistral.ai → Docs → Models (aliases
