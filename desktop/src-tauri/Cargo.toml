[package]
name = "tauri-app"
version = "0.1.0"
description = "Assembly desktop shell (Tauri v2) + FastAPI backend sidecar"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# tauri-build is only required when the "desktop" feature (tauri integration)
# is enabled. Kept optional so `cargo check --no-default-features` compiles
# the pure, platform-agnostic logic on any host (e.g. Linux CI without dbus).
tauri-build = { version = "2", features = [], optional = true }

[features]
# Default builds the full Tauri desktop app (Windows). Use
# `--no-default-features` to compile/test the pure logic on any host.
default = ["desktop"]
desktop = [
  "dep:tauri",
  "dep:tauri-plugin-shell",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-single-instance",
  "dep:keyring",
  "dep:windows-sys",
  "dep:tauri-build",
]

[dependencies]
# ── Always available: pure logic, no Tauri/OS-keyring, testable on any host ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "io"] }

# ── Tauri desktop integration (Windows x86_64-pc-windows-msvc) ──
# Gated behind #[cfg(all(windows, feature = "desktop"))] in source.
tauri = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

# Windows Credential Manager (OS keyring) for desktop secrets.
keyring = { version = "2", optional = true, features = ["windows-native"] }

# Windows Job Object (JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE) so the backend
# and its process tree die even if the Tauri shell crashes. Windows only.
windows-sys = { version = "0.52", optional = true,
  features = ["Win32_Foundation", "Win32_System_Threading"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true


